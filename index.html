<style>

/* =========================================================
   DESIGN
========================================================= */

*{
    box-sizing:border-box;
}

:root{
    --bg:#eeeeee;
    --card:#fafafa;
    --screen:#ffffff;
    --button:#f7f7f7;
    --buttonHover:#e9e9e9;
    --border:#d5d5d5;
    --text:#111111;
    --muted:#666666;
    --equal:#111111;
    --equalText:#ffffff;
    --danger:#c00025;
}

body.dark{
    --bg:#101010;
    --card:#1b1b1b;
    --screen:#111111;
    --button:#252525;
    --buttonHover:#333333;
    --border:#414141;
    --text:#ffffff;
    --muted:#aaaaaa;
    --equal:#ffffff;
    --equalText:#111111;
}

body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    display:flex;
    justify-content:center;

    padding:20px;
}

.app{
    width:min(1100px,100%);
}

.calculator{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:30px;

    padding:25px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.12);
}

/* =========================================================
   TOP
========================================================= */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    margin-bottom:15px;
}

.logo{
    font-size:18px;
    font-weight:700;
    letter-spacing:.04em;
}

.controls{
    display:flex;
    gap:8px;
}

select,
.control{
    background:var(--button);
    color:var(--text);

    border:1px solid var(--border);

    border-radius:10px;

    padding:9px 12px;

    cursor:pointer;
}

/* =========================================================
   ECRAN
========================================================= */

.screen{
    background:var(--screen);

    border:1px solid var(--border);

    border-radius:24px;

    min-height:220px;

    padding:22px;

    display:flex;
    flex-direction:column;

    justify-content:space-between;

    overflow:hidden;
}

.mode{
    color:var(--muted);

    font-size:14px;

    font-weight:600;
}

.expression{
    text-align:right;

    font:
        clamp(24px,4vw,43px)
        "SFMono-Regular",
        Consolas,
        monospace;

    white-space:nowrap;

    overflow-x:auto;

    padding:15px 0;
}

.result{
    text-align:right;

    font:
        clamp(28px,4.5vw,47px)
        "SFMono-Regular",
        Consolas,
        monospace;

    min-height:55px;

    overflow-x:auto;
}

.error{
    color:var(--danger)!important;

    font-size:25px!important;
}

/* =========================================================
   CLAVIER
========================================================= */

.keypad{
    display:grid;

    grid-template-columns:
        repeat(8,1fr);

    gap:9px;

    margin-top:16px;
}

button{
    min-height:62px;

    border:1px solid var(--border);

    border-radius:14px;

    background:var(--button);

    color:var(--text);

    font-size:18px;

    cursor:pointer;

    transition:.08s;
}

button:hover{
    background:var(--buttonHover);
}

button:active{
    transform:scale(.96);
}

.fn{
    font-size:15px;
}

.operator{
    font-size:25px;
}

.equals{
    background:var(--equal);

    color:var(--equalText);

    font-weight:bold;
}

/* =========================================================
   PANELS
========================================================= */

.panel{
    display:none;

    margin-top:15px;

    background:var(--screen);

    border:1px solid var(--border);

    border-radius:18px;

    padding:15px;
}

.panel.show{
    display:block;
}

.more-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;
}

.history{
    max-height:250px;

    overflow:auto;
}

.history-item{
    padding:10px 0;

    border-bottom:
        1px solid var(--border);

    cursor:pointer;
}

.old-expression{
    color:var(--muted);

    font-family:monospace;
}

.old-result{
    font-family:monospace;

    font-size:18px;

    margin-top:4px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

    body{
        padding:8px;
    }

    .calculator{
        padding:12px;

        border-radius:22px;
    }

    .topbar{
        flex-direction:column;

        align-items:flex-start;
    }

    .controls{
        width:100%;
    }

    select,
    .control{
        flex:1;
    }

    .keypad{
        grid-template-columns:
            repeat(5,1fr);

        gap:7px;
    }

    button{
        min-height:58px;

        font-size:16px;
    }

    .fn{
        font-size:13px;
    }

    .screen{
        min-height:185px;

        padding:16px;
    }

    .more-grid{
        grid-template-columns:
            repeat(3,1fr);
    }
}

</style>

<script>

/* =========================================================
   ETAT DE LA CALCULATRICE
========================================================= */

let expression = "";

let lastAnswer = 0;

let memory = 0;

let angleMode = "DEG";

let shiftMode = false;


/* =========================================================
   HISTORIQUE
========================================================= */

let history = [];

try{

history =
JSON.parse(
localStorage.getItem(
"scientificCalculatorHistory"
) || "[]"
);

}catch{

history = [];

}


/* =========================================================
   AFFICHAGE
========================================================= */

function updateDisplay(){

document.getElementById(
"expression"
).textContent =
expression || "0";


document.getElementById(
"modeText"
).textContent =
angleMode;


document.getElementById(
"memoryText"
).textContent =
formatNumber(memory);

}


/* =========================================================
   FORMAT NOMBRE
========================================================= */

function formatNumber(value){

if(
value === undefined ||
value === null
){

return "";

}


/* Nombre */

if(
typeof value === "number"
){

if(
Object.is(value,-0)
){

value=0;

}


if(
!Number.isFinite(value)
){

return "Error";

}


/* Très grands / très petits nombres */

if(
Math.abs(value)>=1e12 ||
(
Math.abs(value)>0 &&
Math.abs(value)<1e-10
)
){

return value.toExponential(10);

}


/* Éviter les longues erreurs flottantes */

let rounded =
Number(
value.toPrecision(14)
);

return String(rounded);

}


/* Complexe */

if(
typeof value === "object" &&
value.re !== undefined &&
value.im !== undefined
){

let re =
formatNumber(value.re);

let im =
formatNumber(
Math.abs(value.im)
);

if(value.im>=0){

return re+" + "+im+"i";

}else{

return re+" - "+im+"i";

}

}


return String(value);

}


/* =========================================================
   INSERER
========================================================= */

function insert(value){

expression += value;

clearResult();

updateDisplay();

}


/* =========================================================
   FONCTION
========================================================= */

function insertFunction(name){

expression += name+"(";

clearResult();

updateDisplay();

}


/* =========================================================
   EXP
========================================================= */

function scientificE(){

expression += "e";

updateDisplay();

}


/* =========================================================
   REPONSE PRECEDENTE
========================================================= */

function insertAnswer(){

insert(
formatNumber(lastAnswer)
);

}


/* =========================================================
   EFFACER
========================================================= */

function clearCalculator(){

expression="";

clearResult();

updateDisplay();

}


/* =========================================================
   SUPPRIMER
========================================================= */

function deleteLast(){

const functions=[

"combinations(",
"permutations(",

"transpose(",

"variance(",
"median(",
"mean(",
"std(",

"asinh(",
"acosh(",
"atanh(",

"asin(",
"acos(",
"atan(",

"sinh(",
"cosh(",
"tanh(",

"sqrt(",
"cbrt(",

"log10(",
"ln(",

"sin(",
"cos(",
"tan(",

"abs(",
"floor(",
"ceil(",
"round(",

"gcd(",
"lcm(",
"mod(",

"det(",
"inv(",

"random(",
"exp("

];


for(
let f of functions
){

if(
expression.endsWith(f)
){

expression =
expression.slice(
0,
expression.length-f.length
);

updateDisplay();

return;

}

}


expression =
expression.slice(0,-1);

updateDisplay();

}


/* =========================================================
   RESULTAT
========================================================= */

function clearResult(){

const result =
document.getElementById(
"result"
);

result.textContent="";

result.classList.remove(
"error"
);

}


/* =========================================================
   ANGLES
========================================================= */

function toRadians(x){

if(
angleMode==="DEG"
){

return x*Math.PI/180;

}

if(
angleMode==="GRAD"
){

return x*Math.PI/200;

}

return x;

}


function fromRadians(x){

if(
angleMode==="DEG"
){

return x*180/Math.PI;

}

if(
angleMode==="GRAD"
){

return x*200/Math.PI;

}

return x;

}


/* =========================================================
   FACTORIELLE
========================================================= */

function factorial(n){

if(
!Number.isFinite(n) ||
n<0 ||
Math.floor(n)!==n
){

throw new Error(
"Factorielle invalide"
);

}

if(n>170){

throw new Error(
"Nombre trop grand"
);

}

let result=1;

for(
let i=2;
i<=n;
i++
){

result*=i;

}

return result;

}


/* =========================================================
   COMBINAISON
========================================================= */

function combinations(n,r){

if(
!Number.isInteger(n) ||
!Number.isInteger(r) ||
n<0 ||
r<0 ||
r>n
){

throw new Error(
"nCr invalide"
);

}

r=Math.min(
r,
n-r
);

let result=1;

for(
let i=1;
i<=r;
i++
){

result =
result*
(n-r+i)/
i;

}

return result;

}


/* =========================================================
   PERMUTATION
========================================================= */

function permutations(n,r){

if(
!Number.isInteger(n) ||
!Number.isInteger(r) ||
n<0 ||
r<0 ||
r>n
){

throw new Error(
"nPr invalide"
);

}

let result=1;

for(
let i=0;
i<r;
i++
){

result *=
(n-i);

}

return result;

}


/* =========================================================
   PGCD
========================================================= */

function gcd(a,b){

a=Math.abs(
Math.trunc(a)
);

b=Math.abs(
Math.trunc(b)
);

while(b!==0){

let t=b;

b=a%b;

a=t;

}

return a;

}


/* =========================================================
   PPCM
========================================================= */

function lcm(a,b){

a=Math.trunc(a);

b=Math.trunc(b);

if(a===0 || b===0)
return 0;

return Math.abs(
a*b
)/
gcd(a,b);

}


/* =========================================================
   MOYENNE
========================================================= */

function mean(array){

if(
!Array.isArray(array) ||
array.length===0
){

throw new Error(
"Liste vide"
);

}

let total=0;

for(
let x of array
){

total+=Number(x);

}

return total/
array.length;

}


/* =========================================================
   MEDIANE
========================================================= */

function median(array){

if(
!Array.isArray(array) ||
array.length===0
){

throw new Error(
"Liste vide"
);

}

let a=
array
.map(Number)
.sort(
(a,b)=>a-b
);

let middle=
Math.floor(
a.length/2
);

if(
a.length%2===0
){

return(
a[middle-1]+a[middle]
)/2;

}

return a[middle];

}


/* =========================================================
   VARIANCE
========================================================= */

function variance(array){

if(
!Array.isArray(array) ||
array.length===0
){

throw new Error(
"Liste vide"
);

}

let m=
mean(array);

let total=0;

for(
let x of array
){

total +=
Math.pow(
Number(x)-m,
2
);

}

return total/
array.length;

}


/* =========================================================
   ECART TYPE
========================================================= */

function std(array){

return Math.sqrt(
variance(array)
);

}


/* =========================================================
   SOMME
========================================================= */

function sum(array){

if(
!Array.isArray(array)
){

throw new Error(
"Liste attendue"
);

}

return array.reduce(
(a,b)=>a+Number(b),
0
);

}


/* =========================================================
   PRODUIT
========================================================= */

function prod(array){

if(
!Array.isArray(array)
){

throw new Error(
"Liste attendue"
);

}

return array.reduce(
(a,b)=>a*Number(b),
1
);

}


/* =========================================================
   MATRIX
========================================================= */

function determinant(matrix){

if(
!Array.isArray(matrix)
){

throw new Error(
"Matrice invalide"
);

}

const n=
matrix.length;

if(n===0)
throw new Error(
"Matrice vide"
);

for(
let row of matrix
){

if(
!Array.isArray(row) ||
row.length!==n
){

throw new Error(
"Matrice non carrée"
);

}

}


/* 1x1 */

if(n===1){

return Number(
matrix[0][0]
);

}


/* 2x2 */

if(n===2){

return(
matrix[0][0]*
matrix[1][1]
-
matrix[0][1]*
matrix[1][0]
);

}


/* Développement */

let det=0;

for(
let col=0;
col<n;
col++
){

let minor=[];

for(
let i=1;
i<n;
i++
){

let row=[];

for(
let j=0;
j<n;
j++
){

if(j!==col){

row.push(
matrix[i][j]
);

}

}

minor.push(row);

}

det +=
Math.pow(-1,col)*
matrix[0][col]*
determinant(minor);

}

return det;

}


/* =========================================================
   INVERSE MATRIX
========================================================= */

function inverseMatrix(matrix){

const n=
matrix.length;

if(n===2){

let det=
determinant(matrix);

if(det===0){

throw new Error(
"Matrice non inversible"
);

}

return [

[
matrix[1][1]/det,
-matrix[0][1]/det
],

[
-matrix[1][0]/det,
matrix[0][0]/det
]

];

}


/* Gauss-Jordan */

let a=
matrix.map(
row=>row.map(Number)
);

for(
let i=0;
i<n;
i++
){

a[i]=
a[i].concat(
Array(n)
.fill(0)
.map(
(_,j)=>
i===j?1:0
)
);

}


for(
let i=0;
i<n;
i++
){

let pivot=i;

for(
let r=i+1;
r<n;
r++
){

if(
Math.abs(a[r][i]) >
Math.abs(a[pivot][i])
){

pivot=r;

}

}

if(
Math.abs(a[pivot][i])<
1e-12
){

throw new Error(
"Matrice non inversible"
);

}

[
a[i],
a[pivot]
]=
[
a[pivot],
a[i]
];


let divisor=
a[i][i];

for(
let j=0;
j<2*n;
j++
){

a[i][j]/=
divisor;

}


for(
let r=0;
r<n;
r++
){

if(r===i)
continue;

let factor=
a[r][i];

for(
let j=0;
j<2*n;
j++
){

a[r][j] -=
factor*a[i][j];

}

}

}


return a.map(
row=>row.slice(n)
);

}


/* =========================================================
   TRANSPOSE
========================================================= */

function transpose(matrix){

if(
!Array.isArray(matrix) ||
!Array.isArray(matrix[0])
){

throw new Error(
"Matrice invalide"
);

}

return matrix[0].map(
(_,column)=>
matrix.map(
row=>row[column]
)
);

}


/* =========================================================
   EVALUATEUR
========================================================= */

function evaluate(input){

/*
   Conversion des fonctions et constantes
   vers notre moteur interne.
*/

let parser=
new Parser(input);

return parser.parse();

}


/* =========================================================
   PARSER MATHEMATIQUE
========================================================= */

class Parser{

constructor(text){

this.text=text;

this.pos=0;

}


/* Ignorer espaces */

skip(){

while(
this.pos<this.text.length &&
/\s/.test(
this.text[this.pos]
)
){

this.pos++;

}

}


/* Caractère actuel */

peek(){

this.skip();

return this.text[
this.pos
];

}


/* Consommer */

consume(char){

this.skip();

if(
this.text.startsWith(
char,
this.pos
)
){

this.pos+=char.length;

return true;

}

return false;

}


/* Expression */

parse(){

let value=
this.additive();

this.skip();

if(
this.pos<this.text.length
){

throw new Error(
"Expression invalide"
);

}

return value;

}


/* + - */

additive(){

let value=
this.multiplicative();

while(true){

this.skip();

if(
this.consume("+")
){

value=
this.add(
value,
this.multiplicative()
);

}

else if(
this.consume("-")
){

value=
this.subtract(
value,
this.multiplicative()
);

}

else{

break;

}

}

return value;

}


/* × ÷ */

multiplicative(){

let value=
this.power();

while(true){

this.skip();

if(
this.consume("*")
){

value=
this.multiply(
value,
this.power()
);

}

else if(
this.consume("/")
){

let divisor=
this.power();

if(
isZero(divisor)
){

throw new Error(
"Division par zéro"
);

}

value=
this.divide(
value,
divisor
);

}

else{

break;

}

}

return value;

}


/* Puissance */

power(){

let value=
this.unary();

this.skip();

if(
this.consume("^")
){

let exponent=
this.power();

value=
this.pow(
value,
exponent
);

}

return value;

}


/* +/- */

unary(){

this.skip();

if(
this.consume("+")
){

return this.unary();

}

if(
this.consume("-")
){

return negate(
this.unary()
);

}

return this.postfix();

}


/* Factorielle */

postfix(){

let value=
this.primary();

while(true){

this.skip();

if(
this.consume("!")
){

if(
typeof value!=="number"
){

throw new Error(
"Factorielle invalide"
);

}

value=
factorial(value);

}

else{

break;

}

}

return value;

}


/* Nombre / fonction / parenthèse */

primary(){

this.skip();

let char=
this.peek();


/* Parenthèse */

if(
this.consume("(")
){

let value=
this.additive();

if(
!this.consume(")")
){

throw new Error(
"Parenthèse manquante"
);

}

return value;

}


/* Tableau */

if(
char==="["
){

return this.parseArray();

}


/* Nombre */

if(
/[0-9.]/.test(char||"")
){

return this.parseNumber();

}


/* Identifiant */

if(
/[A-Za-z_]/.test(
char||""
)
){

let name=
this.parseIdentifier();

if(
name==="pi"
){

return Math.PI;

}

if(
name==="e"
){

return Math.E;

}

if(
name==="i"
){

return {
re:0,
im:1
};

}


/* Fonction */

if(
this.consume("(")
){

let args=[];


/* Aucun argument */

if(
this.consume(")")
){

return this.callFunction(
name,
args
);

}


/* Arguments */

while(true){

args.push(
this.additive()
);

if(
this.consume(")")
){

break;

}

if(
!this.consume(",")
){

throw new Error(
"Virgule attendue"
);

}

}

return this.callFunction(
name,
args
);

}

throw new Error(
"Fonction inconnue: "+name
);

}

throw new Error(
"Caractère inattendu"
);

}


/* Nombre */

parseNumber(){

this.skip();

let start=
this.pos;

while(
this.pos<this.text.length &&
/[0-9.]/.test(
this.text[this.pos]
)
){

this.pos++;

}


/* notation scientifique */

if(
this.text[this.pos]==="e" ||
this.text[this.pos]==="E"
){

this.pos++;

if(
this.text[this.pos]==="+" ||
this.text[this.pos]==="-"
){

this.pos++;

}

while(
this.pos<this.text.length &&
/[0-9]/.test(
this.text[this.pos]
)
){

this.pos++;

}

}

let value=
Number(
this.text.slice(
start,
this.pos
)
);

if(
Number.isNaN(value)
){

throw new Error(
"Nombre invalide"
);

}

return value;

}


/* Identifiant */

parseIdentifier(){

this.skip();

let start=
this.pos;

while(
this.pos<this.text.length &&
/[A-Za-z_]/.test(
this.text[this.pos]
)
){

this.pos++;

}

return this.text.slice(
start,
this.pos
);

}


/* Tableau */

parseArray(){

if(
!this.consume("[")
){

throw new Error(
"Tableau invalide"
);

}

let result=[];

if(
this.consume("]")
){

return result;

}

while(true){

let value=
this.additive();

result.push(value);

if(
this.consume("]")
){

break;

}

if(
!this.consume(",")
){

throw new Error(
"Virgule attendue"
);

}

}

return result;

}


/* =====================================================
   OPERATIONS
===================================================== */

add(a,b){

if(
isComplex(a) ||
isComplex(b)
){

return complexAdd(a,b);

}

return a+b;

}


subtract(a,b){

if(
isComplex(a) ||
isComplex(b)
){

return complexSub(a,b);

}

return a-b;

}


multiply(a,b){

if(
isComplex(a) ||
isComplex(b)
){

return complexMul(a,b);

}

return a*b;

}


divide(a,b){

if(
isComplex(a) ||
isComplex(b)
){

return complexDiv(a,b);

}

return a/b;

}


pow(a,b){

if(
isComplex(a) ||
isComplex(b)
){

return complexPow(a,b);

}

return Math.pow(a,b);

}


/* =====================================================
   FONCTIONS
===================================================== */

callFunction(name,args){

switch(name){

/* Trigonométrie */

case "sin":
return Math.sin(
toRadians(
numberArg(args,0)
)
);

case "cos":
return Math.cos(
toRadians(
numberArg(args,0)
)
);

case "tan":
return Math.tan(
toRadians(
numberArg(args,0)
)
);

case "asin":
return fromRadians(
Math.asin(
numberArg(args,0)
)
);

case "acos":
return fromRadians(
Math.acos(
numberArg(args,0)
)
);

case "atan":
return fromRadians(
Math.atan(
numberArg(args,0)
)
);


/* Hyperbolique */

case "sinh":
return Math.sinh(
numberArg(args,0)
);

case "cosh":
return Math.cosh(
numberArg(args,0)
);

case "tanh":
return Math.tanh(
numberArg(args,0)
);

case "asinh":
return Math.asinh(
numberArg(args,0)
);

case "acosh":
return Math.acosh(
numberArg(args,0)
);

case "atanh":
return Math.atanh(
numberArg(args,0)
);


/* Racines */

case "sqrt":
return Math.sqrt(
numberArg(args,0)
);

case "cbrt":
return Math.cbrt(
numberArg(args,0)
);


/* Log */

case "log":
case "ln":
return Math.log(
numberArg(args,0)
);

case "log10":
return Math.log10(
numberArg(args,0)
);


/* Exponentielle */

case "exp":
return Math.exp(
numberArg(args,0)
);


/* Valeur absolue */

case "abs":{

let x=
args[0];

if(
isComplex(x)
){

return Math.sqrt(
x.re*x.re+
x.im*x.im
);

}

return Math.abs(x);

}


/* Arrondis */

case "floor":
return Math.floor(
numberArg(args,0)
);

case "ceil":
return Math.ceil(
numberArg(args,0)
);

case "round":
return Math.round(
numberArg(args,0)
);


/* Pourcentage */

case "percent":
return numberArg(args,0)/100;


/* PGCD */

case "gcd":
return gcd(
numberArg(args,0),
numberArg(args,1)
);


/* PPCM */

case "lcm":
return lcm(
numberArg(args,0),
numberArg(args,1)
);


/* Modulo */

case "mod":
return numberArg(args,0)%
numberArg(args,1);


/* Aléatoire */

case "random":
return Math.random();


/* Combinaisons */

case "combinations":
return combinations(
numberArg(args,0),
numberArg(args,1)
);


/* Permutations */

case "permutations":
return permutations(
numberArg(args,0),
numberArg(args,1)
);


/* Statistiques */

case "mean":
return mean(args[0]);

case "median":
return median(args[0]);

case "variance":
return variance(args[0]);

case "std":
return std(args[0]);

case "sum":
return sum(args[0]);

case "prod":
return prod(args[0]);


/* Matrices */

case "det":
return determinant(args[0]);

case "inv":
return inverseMatrix(args[0]);

case "transpose":
return transpose(args[0]);


/* Complexe */

case "re":
return args[0].re;

case "im":
return args[0].im;


/* Inverse */

case "invNumber":
return 1/numberArg(args,0);


default:

throw new Error(
"Fonction inconnue: "+name
);

}

}

}


/* =========================================================
   UTILITAIRES
========================================================= */

function numberArg(args,index){

let value=args[index];

if(
typeof value!=="number"
){

throw new Error(
"Nombre attendu"
);

}

return value;

}


function isZero(x){

if(
typeof x==="number"
){

return Math.abs(x)<1e-15;

}

return false;

}


function isComplex(x){

return(
x &&
typeof x==="object" &&
typeof x.re==="number" &&
typeof x.im==="number"
);

}


function negate(x){

if(
isComplex(x)
){

return{
re:-x.re,
im:-x.im
};

}

return -x;

}


/* =========================================================
   COMPLEXES
========================================================= */

function complexValue(x){

if(
isComplex(x)
){

return x;

}

return{
re:x,
im:0
};

}


function complexAdd(a,b){

a=complexValue(a);

b=complexValue(b);

return{
re:a.re+b.re,
im:a.im+b.im
};

}


function complexSub(a,b){

a=complexValue(a);

b=complexValue(b);

return{
re:a.re-b.re,
im:a.im-b.im
};

}


function complexMul(a,b){

a=complexValue(a);

b=complexValue(b);

return{

re:
a.re*b.re-
a.im*b.im,

im:
a.re*b.im+
a.im*b.re

};

}


function complexDiv(a,b){

a=complexValue(a);

b=complexValue(b);

let denominator=
b.re*b.re+
b.im*b.im;

if(
denominator===0
){

throw new Error(
"Division par zéro"
);

}

return{

re:
(a.re*b.re+
a.im*b.im)/
denominator,

im:
(a.im*b.re-
a.re*b.im)/
denominator

};

}


function complexPow(a,b){

/*
   Pour garder le moteur autonome,
   on gère ici les puissances complexes
   via forme polaire.
*/

a=complexValue(a);

b=complexValue(b);

let radius=
Math.sqrt(
a.re*a.re+
a.im*a.im
);

let theta=
Math.atan2(
a.im,
a.re
);

let logR=
Math.log(radius);

let A=
b.re*logR-
b.im*theta;

let B=
b.re*theta+
b.im*logR;

let magnitude=
Math.exp(A);

return{

re:
magnitude*Math.cos(B),

im:
magnitude*Math.sin(B)

};

}


/* =========================================================
   HISTORIQUE
========================================================= */

function renderHistory(){

const box=
document.getElementById(
"history"
);


if(
history.length===0
){

box.textContent=
"Aucun calcul.";

return;

}


box.innerHTML="";


history.forEach(
item=>{

const row=
document.createElement(
"div"
);

row.className=
"history-item";

row.innerHTML=

"<div class='old-expression'>"+
escapeHTML(
item.expression
)+
"</div>"+

"<div class='old-result'>"+
"= "+
escapeHTML(
item.result
)+
"</div>";

row.onclick=
function(){

expression=
item.expression;

document.getElementById(
"result"
).textContent=
item.result;

updateDisplay();

};

box.appendChild(row);

}
);

}


function escapeHTML(value){

return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


function clearHistory(){

history=[];

localStorage.removeItem(
"scientificCalculatorHistory"
);

renderHistory();

}

);

){

}

);

){

/* =========================================================
   CLAVIER
========================================================= */

document.addEventListener(
"keydown",
function(event){

if(
event.ctrlKey ||
event.metaKey
){

return;

}


/* chiffres */

if(
/^[0-9.]$/.test(
event.key
)
){

insert(event.key);

return;

}


/* opérateurs */

if(
"+-*/^(),".includes(
event.key
)
){

insert(event.key);

return;

}


/* Entrée */

if(
event.key==="Enter" ||
event.key==="="
){

calculate();

return;

}


/* Backspace */

if(
event.key==="Backspace"
){

deleteLast();

return;

}


/* Escape */

if(
event.key==="Escape"
){

clearCalculator();

}

});


/* =========================================================
   CALCUL FINAL
========================================================= */

function calculate(){

if(
!expression.trim()
){

return;

}


const resultBox=
document.getElementById(
"result"
);


try{

let value=
evaluate(expression);


/* Vérifier */

if(
typeof value==="number" &&
!Number.isFinite(value)
){

throw new Error(
"Résultat invalide"
);

}


/* Sauvegarder réponse */

lastAnswer=value;


/* Format */

let result=
formatNumber(value);


/* Afficher */

resultBox.textContent=
result;

resultBox.classList.remove(
"error"
);


/* Historique */

history.unshift({

expression:
expression,

result:
result

});


history=
history.slice(0,50);


localStorage.setItem(
"scientificCalculatorHistory",
JSON.stringify(history)
);


renderHistory();


}catch(error){

console.error(
"Calcul:",
error
);


resultBox.textContent=
"Error";


resultBox.classList.add(
"error"
);

}

}


/* =========================================================
   RESTAURATION THEME
========================================================= */

if(
localStorage.getItem(
"calculatorDark"
)==="1"
){

document.body.classList.add(
"dark"
);

}


/* =========================================================
   INITIALISATION
========================================================= */

updateDisplay();

renderHistory();
